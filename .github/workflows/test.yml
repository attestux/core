name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck tpm2-tools
      - name: Check Go module
        run: ./tools/check-go.sh
      - name: Check shell scripts
        run: shellcheck tools/*.sh
      - name: TPM simulator and tpm2_eventlog compatibility
        env:
          CGO_ENABLED: "1"
        run: |
          set -o pipefail
          go test -tags=tpmsimulator -count=1 -v ./... | tee simulator.log
          ./tools/check-simulator-log.sh simulator.log
          go test -tags=tpmsimulator,attestux_simulator -count=1 -v ./... | tee simulator-trust.log
          ./tools/check-simulator-log.sh simulator-trust.log

  mobile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Install Android NDK
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "ndk;$(cat ndk.version)"
      - name: Build production verifier AAR
        run: ./tools/build-mobile-core.sh build/attestux.aar false
      - name: Build simulator-trust verifier AAR
        run: ./tools/build-mobile-core.sh build/attestux-simulator.aar true
